<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Biblioteca Digital</title>
    <meta name="description" content="Aplicativo elegante e sóbrio para leitura confortável de livros digitais e consulta bíblica." />
    
    <!-- PWA e Mobile Web App Tags -->
    <meta name="theme-color" content="#18181B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Biblioteca Digital" />
    <meta name="application-name" content="Biblioteca Digital" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Ícones e Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:title" content="Biblioteca Digital" />
    <meta property="og:description" content="Aplicativo elegante e sóbrio para leitura confortável de livros digitais e consulta bíblica." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        // Intercepta instanciações de WebSocket do Vite HMR para prover um socket aberto seguro
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OriginalWebSocket = window.WebSocket;
          const MockWebSocket = function(url, protocols) {
            const urlStr = String(url || '');
            const isViteHmr =
              protocols === 'vite-hmr' ||
              protocols === 'vite-ping' ||
              (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping'))) ||
              urlStr.includes('token=') ||
              urlStr.includes('vite');

            if (isViteHmr) {
              const target = new EventTarget();
              const dummy = {
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                readyState: 1, // ReadyState OPEN evita rejeição de conexão do cliente Vite
                url: urlStr,
                protocol: Array.isArray(protocols) ? protocols[0] : (protocols || ''),
                extensions: '',
                binaryType: 'blob',
                bufferedAmount: 0,
                send: function() {},
                close: function() {
                  dummy.readyState = 3;
                },
                addEventListener: function(type, listener, options) {
                  target.addEventListener(type, listener, options);
                  if (type === 'open') {
                    setTimeout(() => target.dispatchEvent(new Event('open')), 0);
                  }
                },
                removeEventListener: function(type, listener, options) {
                  target.removeEventListener(type, listener, options);
                },
                dispatchEvent: function(event) {
                  return target.dispatchEvent(event);
                },
                set onopen(fn) {
                  if (fn) {
                    target.addEventListener('open', fn);
                    setTimeout(() => target.dispatchEvent(new Event('open')), 0);
                  }
                },
                set onclose(fn) {
                  if (fn) target.addEventListener('close', fn);
                },
                set onerror(fn) {
                  if (fn) target.addEventListener('error', fn);
                },
                set onmessage(fn) {
                  if (fn) target.addEventListener('message', fn);
                },
              };
              return dummy;
            }

            return new OriginalWebSocket(url, protocols);
          };

          MockWebSocket.CONNECTING = 0;
          MockWebSocket.OPEN = 1;
          MockWebSocket.CLOSING = 2;
          MockWebSocket.CLOSED = 3;
          MockWebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket = MockWebSocket;
        }

        // Suprime logs transitórios de WebSocket no console e em promessas não tratadas
        const _origConsoleError = console.error;
        console.error = function(...args) {
          if (args.length > 0) {
            const first = args[0];
            const msg = typeof first === 'string' ? first : (first?.message || String(first));
            if (
              msg &&
              (msg.includes('WebSocket closed without opened') ||
                msg.includes('WebSocket') ||
                (args[0] === '[vite]' && String(args[1] || '').includes('WebSocket')))
            ) {
              return;
            }
          }
          _origConsoleError.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(e) {
          const msg = e?.reason?.message || String(e?.reason || '');
          if (msg.includes('WebSocket') || msg.includes('vite')) {
            e.preventDefault();
            e.stopImmediatePropagation?.();
          }
        });

        window.addEventListener('error', function(e) {
          const msg = e?.message || String(e || '');
          if (msg.includes('WebSocket')) {
            e.preventDefault();
            e.stopImmediatePropagation?.();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
